name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']   # v1.0.0 → imagen versionada; no redespliega el homelab (ese job solo corre en main)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-homelab:
    needs: build-and-push
    # Solo el repo original y solo desde main: un fork nunca debe llegar al runner del homelab
    if: github.repository == 'tonyslabs/ytconvert' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab, ytconvert]
    steps:
      - name: Actualizar contenedor en el homelab
        run: |
          set -e
          cd ~/docker/apps/ytconvert
          docker compose pull
          docker compose up -d
          docker image prune -f
